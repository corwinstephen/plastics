---
layout: default
---

<p class="post__back">
  <a href="{{ "/" | relative_url }}">Back</a>
</p>

<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post__meta">{{ page.date | date: site.theme_config.date_format }}</p>
  {% if page.subtitle %}
  <p class="post__subtitle">{{ page.subtitle }}</p>
  {% endif %}

  <div class="post__body">
    {{ content }}
  </div>
</article>
