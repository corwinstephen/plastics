name: Fetch Substack feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Fetch feed
        run: ruby scripts/fetch-substack-feed.rb

      - name: Commit updated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          if git diff --staged --quiet; then
            echo "No Substack feed changes"
            exit 0
          fi
          git commit -m "Update Substack posts from RSS"
          git push
