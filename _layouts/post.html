---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post__meta">{{ page.date | date: site.theme_config.date_format }}</p>
  {% if page.subtitle %}
  <p class="post__subtitle">{{ page.subtitle }}</p>
  {% endif %}

  <div class="post__body">
    {{ content }}
  </div>

  {% if page.canonical %}
  <p class="post__canonical">
    <a href="{{ page.canonical }}">Originally on Substack</a>
  </p>
  {% endif %}
</article>
